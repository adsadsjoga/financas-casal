name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build não fala com o Supabase de verdade (páginas são dinâmicas, não
      # geradas estaticamente) — só precisa de string não-vazia pra passar
      # pelo `!` dos clients em src/lib/supabase/*.ts.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_APP_URL: https://financas-casal-one-iota.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_rudUssDVqXIyux99yVSmqoG3
      VERCEL_PROJECT_ID: prj_HrcLaKl92RyLilzGkwO9NdPyG2sm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Puxar config de produção da Vercel
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build de produção (Vercel)
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
